# Arvoo Control Plane - Nginx site, HTTP only (no domain yet).
#
# install.sh installs this file and substitutes the backend port.
# When ARVOO_DOMAIN is set, install.sh replaces this with an HTTPS site
# (see render_tls_site). Do not edit the generated file by hand.
#
# Traffic model:
#   Internet -> :80/:443 (Nginx)
#     /           → public marketing site (camouflage)
#     /panel/     → React admin UI (ARVOO_PANEL_PATH)
#     /api/       → 127.0.0.1:4001 (Fastify)
# The backend port is never published publicly.

upstream arvoo_api {
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /etc/nginx/snippets/arvoo-common.conf;
}
