# Arvoo Control Plane - Nginx site, HTTP only (no domain yet).
#
# install.sh installs this file and substitutes the backend port and the
# document root with the configured values (ARVOO_API_PORT / ARVOO_INSTALL_ROOT),
# so the numbers below are only the defaults. When ARVOO_DOMAIN is set,
# install.sh replaces this file with a generated HTTPS site that redirects
# HTTP -> HTTPS (see render_tls_site in install.sh). Do not edit the generated
# file by hand.
#
# Traffic model:
#   Internet -> :80 (Nginx) -> /api/ -> 127.0.0.1:4001 (Fastify)
#                           -> /     -> apps/web/dist  (React build)
# The backend port is never published publicly.

upstream arvoo_api {
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/arvoo/apps/web/dist;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /etc/nginx/snippets/arvoo-common.conf;
}
