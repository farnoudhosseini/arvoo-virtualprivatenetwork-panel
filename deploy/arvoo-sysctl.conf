# Arvoo Control Plane - host tuning for VPN nodes.
#
# Installed to /etc/sysctl.d/99-arvoo.conf by install.sh (idempotent).
#
# IPv4 forwarding is required for OpenVPN tunnel traffic and for GRE tunnels
# between nodes. Setting it here makes the setting survive a reboot, so a node
# keeps forwarding after it restarts and the node agent does not need to perform
# a privileged sysctl write for every deployment.
net.ipv4.ip_forward = 1
