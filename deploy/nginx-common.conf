# Shared location blocks for the Arvoo panel. Included by both the HTTP and
# HTTPS vhosts in /etc/nginx/sites-available/arvoo.

# ---- Backend API ----------------------------------------------------------
# Everything under /api/ goes to the Fastify process on loopback. The health
# probe (/health) is served by the same process.
location /api/ {
    proxy_pass http://arvoo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Matches the app-level body limit (4 MB) with headroom for JSON encoding.
    client_max_body_size 8m;
}

location = /health {
    proxy_pass http://arvoo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}

# ---- Not a public site -----------------------------------------------------
# The panel is an internal control plane. robots.txt is a courtesy, not a
# security control: the X-Robots-Tag header below is what actually keeps it out
# of indexes, and the API enforces authentication regardless of the URL.
location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "User-agent: *\nDisallow: /\n";
}
location = /favicon.ico { access_log off; log_not_found off; }

# Never serve source maps or dotfiles from the panel build.
location ~* \.map$ { return 404; }
location ~ /\.(?!well-known) { return 404; }

# ---- Static frontend (React/Vite build) -----------------------------------
# SPA: unknown paths fall back to index.html so react-router owns routing.
location / {
    index index.html;
    try_files $uri $uri/ /index.html;

    # Immutable hashed assets can be cached aggressively.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}

# ---- Security headers -----------------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# The panel must never appear in search results, even if its hostname leaks.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

# Hide the Nginx version from responses.
server_tokens off;

# ---- Compression ----------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    font/woff2;
