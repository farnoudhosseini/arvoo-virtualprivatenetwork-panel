# Shared location blocks for the Arvoo panel. Included by both the HTTP and
# HTTPS vhosts in /etc/nginx/sites-available/arvoo.
#
# Traffic model (camouflage-friendly):
#   /           → public marketing site (/var/www/arvoo-site) when present
#   /api/       → Fastify control plane (loopback)
#   /panel/     → React admin UI (apps/web/dist)  [ARVOO_PANEL_PATH, default /panel]
# The backend port is never published publicly.

# ---- Backend API ----------------------------------------------------------
location /api/ {
    proxy_pass http://arvoo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    client_max_body_size 8m;
}

location = /health {
    proxy_pass http://arvoo_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}

# ---- Panel UI under a non-obvious path ------------------------------------
# install.sh substitutes __PANEL_PATH__ and __PANEL_ROOT__.
# SPA fallback so react-router owns client routes under the same prefix.
location __PANEL_PATH__/ {
    alias __PANEL_ROOT__/;
    index index.html;
    try_files $uri $uri/ __PANEL_PATH__/index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}

# Exact match so /panel redirects to /panel/
location = __PANEL_PATH__ {
    return 301 __PANEL_PATH__/;
}

# Never serve source maps or dotfiles from the panel build.
location ~* \.map$ { return 404; }
location ~ /\.(?!well-known) { return 404; }

# ---- Public marketing site (camouflage) -----------------------------------
# Root serves the static site. If the site is missing, fall back to a blank 404
# rather than exposing the panel at /.
location / {
    root /var/www/arvoo-site;
    index index.html;
    try_files $uri $uri/ /index.html;
}

location = /robots.txt {
    root /var/www/arvoo-site;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}
location = /favicon.ico { access_log off; log_not_found off; }

# ---- Security headers -----------------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    font/woff2;
